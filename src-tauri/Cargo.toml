[package]
name = "aion"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
unrar = "0.5.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
walkdir = "2.5.0"
natord = "1.0.9"
anyhow = "1.0.104"
regex = "1.13.1"
tauri-plugin-dialog = "2.8.3"
jpeg-decoder = { version = "0.3", default-features = false }
ureq = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image decoding, zip and unrar are painfully slow unoptimised; optimise deps even in dev.
[profile.dev.package."*"]
opt-level = 2
