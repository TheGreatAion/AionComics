<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AionComics</title>
    <script>try{var t=localStorage.getItem("aion.theme"),m=localStorage.getItem("aion.motion"),d=document.documentElement;if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))d.dataset.theme="light";if(m)d.dataset.motion=m}catch(e){}</script>
    <style>html,body{background:#1d1b19;margin:0}html[data-theme=light],html[data-theme=light] body{background:#ebe5da}</style>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
