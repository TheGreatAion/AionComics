<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  .wrap{display:flex;flex-direction:column;gap:34px}
  .lab{font:600 13px var(--font-sans);color:var(--foreground);margin:0 0 10px 2px}
  .lab small{display:block;font-weight:400;font-size:12px;color:var(--muted-foreground);margin-top:3px;line-height:1.45}
  .mock{position:relative;width:100%;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(127,127,127,.2)}
  .vp{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--fg);
      font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  .vp *{margin:0}
  .dark{--bg:#1c1c1e;--side:rgba(255,255,255,.035);--sideline:rgba(0,0,0,.45);--fg:#f5f5f7;--fg2:#d1d1d6;--mut:#8e8e93;--faint:#636366;
        --hover:rgba(255,255,255,.1);--field:rgba(255,255,255,.08);--track:rgba(255,255,255,.16);--btn:#f5f5f7;--btnfg:#111;--ghost:rgba(255,255,255,.1);
        --sh:0 1px 0 rgba(255,255,255,.07) inset,0 2px 4px rgba(0,0,0,.3),0 18px 30px -16px rgba(0,0,0,.9);--glow:.22;--accent:#0a84ff}
  .light{--bg:#ffffff;--side:#f2f2f4;--sideline:rgba(0,0,0,.08);--fg:#1d1d1f;--fg2:#3a3a3c;--mut:#6e6e73;--faint:#aeaeb2;
        --hover:rgba(0,0,0,.07);--field:rgba(0,0,0,.06);--track:rgba(0,0,0,.12);--btn:#1d1d1f;--btnfg:#fff;--ghost:rgba(0,0,0,.06);
        --sh:0 0 0 1px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.08),0 16px 28px -16px rgba(0,0,0,.45);--glow:.16;--accent:#007aff}
  .disp{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
  .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .sb{position:absolute;left:0;top:0;bottom:0;width:228px;padding:58px 10px 14px;background:var(--side);border-right:1px solid var(--sideline);z-index:2}
  .search{position:absolute;left:12px;right:12px;top:14px;height:30px;border-radius:8px;background:var(--field);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--mut);font-size:13px}
  .search kbd{margin-left:auto;font:11px inherit;font-family:inherit;color:var(--faint);border:1px solid var(--sideline);border-radius:4px;padding:0 5px}
  .it{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:7px;color:var(--fg2);font-size:13px}
  .it svg{width:16px;height:16px;flex:none;opacity:.75}
  .it.on{background:var(--hover);color:var(--fg)}
  .it .k{margin-left:auto;font-size:11.5px;color:var(--faint)}
  .g{font-size:11px;font-weight:600;color:var(--mut);margin:18px 10px 6px}
  .main{position:absolute;left:228px;right:0;top:0;bottom:0;overflow:hidden;padding:26px 40px}
  .glow{position:absolute;left:-80px;right:-80px;top:-160px;height:520px;background-size:cover;background-position:center;filter:blur(80px) saturate(1.6);opacity:var(--glow);
        -webkit-mask:linear-gradient(180deg,#000 30%,transparent);mask:linear-gradient(180deg,#000 30%,transparent);pointer-events:none}
  .main>*:not(.glow){position:relative}
  h1.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
  .sh{display:flex;align-items:baseline;margin:28px 0 14px}
  .sh b{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .sh small{margin-left:10px;font-size:13px;color:var(--mut)}
  .sh .all{margin-left:auto;font-size:13px;color:var(--mut)}
  .row{display:flex;gap:26px;align-items:flex-end}
  .t{flex:none;position:relative}
  .t img{display:block;width:100%;height:auto;border-radius:4px;box-shadow:var(--sh)}
  .t .a{font-size:13px;font-weight:600;margin-top:11px}
  .t .b{font-size:12px;color:var(--mut);margin-top:1px;display:flex;gap:6px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .bar{height:3px;border-radius:2px;background:var(--track);overflow:hidden}.bar span{display:block;height:100%;background:var(--fg)}

  /* featured current book */
  .feat{display:flex;gap:22px;align-items:flex-end;flex:none;margin-right:12px}
  .feat .t{width:172px}
  .feat .info{width:200px;padding-bottom:4px}
  .feat .eye{font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .feat .ti{font-size:22px;font-weight:700;letter-spacing:-.015em;margin-top:4px;line-height:1.15}
  .feat .su{color:var(--mut);margin-top:3px}
  .feat .bar{margin-top:14px;width:180px}
  .feat .pg{font-size:12px;color:var(--mut);margin-top:6px}
  .resume{display:inline-flex;align-items:center;gap:7px;margin-top:16px;background:var(--btn);color:var(--btnfg);font-weight:600;border-radius:999px;padding:8px 18px 8px 14px}
  .resume svg{width:12px;height:12px}

  /* hover state demo */
  .t.hov img{transform:translateY(-6px) scale(1.03);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 26px 40px -14px rgba(0,0,0,.95)}
  .t.hov .ov{position:absolute;left:8px;right:8px;display:flex;justify-content:space-between;transform:translateY(-6px)}
  .t.hov .ov span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,22,.72);backdrop-filter:blur(10px);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .t.hov .ov svg{width:12px;height:12px}

  /* grouped recently added */
  .grp{position:relative}
  .grp .back{position:absolute;inset:0;border-radius:4px;background:var(--faint);opacity:.35;transform:translate(6px,-6px)}
  .grp .back2{opacity:.2;transform:translate(12px,-12px)}
  .badge{position:absolute;right:6px;top:6px;font-size:11px;font-weight:600;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;z-index:2}

  /* series page */
  .hero{position:relative;margin:-26px -40px 0;padding:34px 40px 30px;display:flex;gap:34px;align-items:flex-end;overflow:hidden}
  .hero .bgi{position:absolute;inset:-100px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5);opacity:.5}
  .hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,28,30,.35),var(--bg) 96%)}
  .hero>*:not(.bgi):not(.fade){position:relative}
  .hero .cv{width:188px;flex:none}
  .hero .cv img{display:block;width:100%;border-radius:5px;box-shadow:0 30px 50px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08)}
  .crumb{font-size:12.5px;color:var(--mut)}
  .stitle{font-size:44px;font-weight:700;letter-spacing:-.025em;margin-top:2px}
  .by{font-size:16px;color:var(--fg2);margin-top:2px}
  .meta{font-size:12.5px;color:var(--mut);margin-top:8px}
  .syn{font-size:13px;line-height:1.55;color:var(--fg2);max-width:640px;margin-top:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .acts{display:flex;align-items:center;gap:10px;margin-top:18px}
  .ghost{background:var(--ghost);border-radius:999px;padding:8px 16px}
  .acts .note{font-size:12px;color:var(--mut);margin-left:6px}
  .tool{display:flex;align-items:center;margin:8px 0 16px}
  .tool b{font-size:19px;font-weight:700;margin-right:16px}
  .tool .seg{margin-left:auto;display:flex;gap:2px;background:var(--field);border-radius:7px;padding:2px}
  .tool .seg span{padding:3px 10px;border-radius:5px;font-size:12px;color:var(--mut)}.tool .seg .on{background:var(--hover);color:var(--fg)}
  .tool .sort{font-size:12.5px;color:var(--mut);margin-right:14px}
  .vols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:24px 22px;align-items:end}
  .vols .t{min-width:0}
  .vols .t img{width:100% !important;aspect-ratio:auto !important}
  .vols .t.read img{opacity:.5}
  .vols .t .chk{position:absolute;right:6px;width:18px;height:18px;border-radius:50%;background:rgba(20,20,22,.75);display:grid;place-items:center;color:#fff}
  .vols .t .chk svg{width:10px;height:10px}
</style></head>

nland Saga", "l": "Vol. 15", "t": "", "p": 0, "n": 297, "img": "file:///H:/Comics/.yacreaderlibrary/covers/f68e7c1545b7842e6dfad310365fa0c6ec7cca211354372822.jpg", "r": 1.421, "last": null}], "vmeta": ["Makoto Yukimura", "Kodansha Comics USA", "<p><strong><em>FOR HONOR AND VENGEANCE</em></strong></p><p><em>As a child, Thorfinn sat at the feet of the great Leif Ericson and thrilled to wild tales of a land far to the west. But his youthful fantasies were shattered by a mercenary raid. Raised by the Vikings who murdered his family, Thorfinn became a terrifying warrior, forever seeking to kill the band's leader, Askeladd, and avenge his father. Sustaining Throfinn through his ordeal are his pride in his family and his dreams of a fertile westward land, a land without war or slavery...the land Leif called <strong>Vinland</strong>.</em></p><h2>Chapter Titles</h2><ul><li>Chapter 1: Normanni</li><li>Chapter 2: Somewhere Not Here</li><li>Chapter 3: Beyond the Edge of the Sea</li><li>Chapter 4: Unbreakable Chains</li><li>Chapter 5: Troll</li><li>Bonus Material: Heroic Exploits of Viking Girl Ylva</li><li>Chapter 6: Messenger From the Battlefield</li><li>Chapter 7: Sword</li><li>Chapter 8: The Journey Begins</li><li>Chapter 9: A Trap In Distant Seas</li><li>Chapter 10: Night Wake</li><li>Chapter 11: Cage</li><li>Chapter 12: More Than A Monster</li><li>Chapter 13: Smell</li><li>Chapter 14: The Sword of Thors</li><li>Chapter 15: A True Warrior</li><li>Chapter 16: The Death of Thors</li><li>Special Report: I Went To the Land of Aurora Borealis</li><li>Bonus Story: For Our Farewell Is Near, Part 1</li></ul>"]};
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  cont:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12a1 1 0 0 1 1 1v16l-7-4-7 4V5a1 1 0 0 1 1-1z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg>',

};
const pct = c => Math.max(1, Math.round((c.p + 1) / c.n * 100));
const im = (c, w) => `<img src="${c.img}" style="width:${w}px;aspect-ratio:1/${c.r}" alt="">`;
const sidebar = active => `<div class="sb"><div class="search">${I.search}Search<kbd>Ctrl K</kbd></div>
  <div class="it ${active === 'home' ? 'on' : ''}">${I.home}Home</div>
  <div class="it">${I.cont}Continue Reading<span class="k">${D.cont.length >= 12 ? 24 : D.cont.length}</span></div>
  <div class="it">${I.next}Up Next<span class="k">15</span></div>
  <div class="it">${I.rec}Recently Added</div>
  <div class="g">Collections</div>
  ${[['DC', 163], ['Indie', 243], ['Manga', 188], ['Marvel', 233]].map(([n, k]) => `<div class="it ${active === n ? 'on' : ''}">${I.stack}${n}<span class="k">${k}</span></div>`).join('')}
  <div class="g">Lists</div>
  <div class="it">${I.done}Finished</div>
  <div class="it" style="position:absolute;left:10px;right:10px;bottom:12px">${I.gear}Settings</div></div>`;

const C = D.cont, F = C[0];
function home(theme, third) {
  const others = C.slice(1, 6);
  const featured = `<div class="feat"><div class="t">${im(F, 172)}</div>
    <div class="info"><div class="eye">Continue</div><div class="ti disp">${F.s}</div><div class="su">${F.l}</div>
      <div class="bar"><span style="width:${pct(F)}%"></span></div><div class="pg">Page ${F.p + 1} of ${F.n}</div>
      <span class="resume">${I.play}Resume</span></div></div>`;
  const tile = (c, i) => `<div class="t ${i === 1 ? 'hov' : ''}" style="width:112px">${im(c, 112)}
      ${i === 1 ? `<div class="ov" style="bottom:${54}px"><span>${I.play}</span><span>${I.more}</span></div>` : ''}
      <div class="a ell">${c.s}</div><div class="b">${pct(c)}% · ${c.l}</div></div>`;
  const upnext = D.upnext.slice(0, 8).map(c => `<div class="t" style="width:112px">${im(c, 112)}<div class="a ell">${c.s}</div><div class="b"><span class="dot"></span>${c.l}</div></div>`).join('');
  const stale = D.stale.slice(0, 8).map(c => `<div class="t" style="width:112px">${im(c, 112)}<div class="bar" style="margin-top:9px"><span style="width:${pct(c)}%"></span></div><div class="a ell" style="margin-top:7px">${c.s}</div><div class="b">${c.l}</div></div>`).join('');
  const recent = D.recent.slice(0, 8).map(c => `<div class="t grp" style="width:112px"><div style="position:relative">${c.cnt > 1 ? '<div class="back back2"></div><div class="back"></div>' : ''}${im(c, 112)}${c.cnt > 1 ? `<span class="badge">${c.cnt}</span>` : ''}</div><div class="a ell">${c.s.trim()}</div><div class="b">${c.cnt > 1 ? c.cnt + ' issues' : 'New'}</div></div>`).join('');
  return `<div class="vp ${theme}">${sidebar('home')}<div class="main"><div class="glow" style="background-image:url('${F.img}')"></div>
    <h1 class="big disp">Home</h1>
    <div class="sh"><b>Continue Reading</b><span class="all">See All ›</span></div>
    <div class="row">${featured}${others.map(tile).join('')}</div>
    <div class="sh"><b>Up Next</b><small>The next book in series you’re reading</small><span class="all">See All ›</span></div>
    <div class="row">${upnext}</div>
    ${third === 'stale'
      ? `<div class="sh"><b>Pick Up Again</b><small>Started, then untouched for over a month</small></div><div class="row">${stale}</div>`
      : `<div class="sh"><b>Recently Added</b><small>Grouped by series</small><span class="all">See All ›</span></div><div class="row">${recent}</div>`}
  </div></div>`;
}

function series() {
  const V = D.vin, cur = V.findIndex(v => v.p > 0), M = D.vmeta;
  const syn = (M[2] || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  return `<div class="vp dark">${sidebar('Manga')}<div class="main">
    <div class="hero"><div class="bgi" style="background-image:url('${V[cur].img}')"></div><div class="fade"></div>
      <div class="cv"><img src="${V[0].img}" alt=""></div>
      <div><div class="crumb">‹ Manga</div><div class="stitle disp">Vinland Saga</div><div class="by">${M[0]}</div>
        <div class="meta">${V.length} volumes · ${M[1]} · 2013–2026 · Read right to left</div>
        <div class="syn">${syn}</div>
        <div class="acts"><span class="resume">${I.play}Continue ${V[cur].l}</span><span class="ghost">${I.more.replace('<svg', '<svg width="14" height="14"')}</span><span class="note">${cur} of ${V.length} read · ${pct(V[cur])}% into ${V[cur].l}</span></div></div></div>
    <div class="tool"><b>Volumes</b><span class="sort">Sort: Volume ▾</span><span class="seg"><span class="on">Grid</span><span>List</span></span></div>
    <div class="vols">${V.slice(0, 14).map((v, i) => `<div class="t ${i < cur ? 'read' : ''}">${im(v, 132)}
       ${i < cur ? `<span class="chk" style="bottom:46px">${I.check}</span>` : ''}
       ${i === cur ? `<div class="bar" style="margin-top:8px"><span style="width:${pct(v)}%"></span></div>` : ''}
       <div class="a ell" style="margin-top:${i === cur ? 7 : 10}px">${v.l}</div><div class="b ell">${v.t || '&nbsp;'}</div></div>`).join('')}</div>
  </div></div>`;
}

const S = [
  ['Home — dark', 'The current book is featured at 1.5× with Resume; one cover shows its hover state (lift, ▶ resume, ⋯ menu). Up Next is the next unread book in every series you’re reading; Pick Up Again finds books you abandoned. A faint glow from the current cover tints the top. Covers keep their real proportions and line up along the bottom.', home('dark', 'stale')],
  ['Home — light', 'Same screen in light mode (it follows Windows’ setting). The third row here shows Recently Added grouped by series, with a stack and a count instead of 25 separate Absolute Batman issues.', home('light', 'recent')],
  ['Series page', 'A blurred-cover header with credits, synopsis and “Continue Vol. 12”, then volumes at their real shape. Read volumes fade back with a check (Vols 1–11 are shown as read here to demonstrate; your library has them unmarked).', series()],
];
document.getElementById('wrap').innerHTML = S.map(([t, d, h]) =>
  `<section><div class="lab">${t}<small>${d}</small></div><div class="mock">${h}</div></section>`).join('');
function fit() {
  document.querySelectorAll('.mock').forEach(m => {
    const s = m.clientWidth / 1280;
    m.querySelector('.vp').style.transform = `scale(${s})`;
    m.style.height = 800 * s + 'px';
  });
}
fit(); addEventListener('resize', fit);
</script>
