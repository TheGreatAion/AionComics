<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{
    --black:#050505; --white:#f2f2f0; --grey:rgba(242,242,240,.42); --line:rgba(242,242,240,.1);
    --type:"Jost","Futura","Century Gothic","Avenir Next","Segoe UI",system-ui,sans-serif;
  }
  .wrap{display:flex;flex-direction:column;gap:22px;font-family:var(--type)}
  .cap{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted-foreground);margin:0 0 8px 2px}
  .screen{position:relative;overflow:hidden;border-radius:var(--radius);background:var(--black);color:var(--white);padding:28px 32px 36px}

  .bar{display:flex;align-items:baseline;margin-bottom:44px}
  .mark{font-size:12px;font-weight:400;letter-spacing:.5em}
  .nav{margin-left:auto;display:flex;gap:26px;font-size:11px;letter-spacing:.08em;color:var(--grey)}
  .nav b{font-weight:400;color:var(--white)}

  .resume{display:flex;gap:28px;align-items:flex-end;margin-bottom:56px}
  .resume .cover{width:104px;flex:none}
  .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-bottom:12px}
  .title{font-size:26px;font-weight:300;letter-spacing:.02em;margin:0 0 6px}
  .sub{font-size:11px;color:var(--grey);letter-spacing:.04em;margin-bottom:18px}
  .prog{width:180px;height:1px;background:var(--line);position:relative}
  .prog span{position:absolute;inset:0 auto 0 0;background:var(--white)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:26px 18px}
  .cover{position:relative;aspect-ratio:2/3;border-radius:2px;overflow:hidden}
  .item .lbl{font-size:10px;letter-spacing:.04em;color:var(--grey);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .bar1{height:1px;margin-top:8px;background:transparent;position:relative}
  .item .bar1 span{position:absolute;inset:0 auto 0 0;background:var(--white);opacity:.7}

  .reader{padding:0;height:440px;cursor:pointer}
  .stage{position:absolute;inset:0;overflow:hidden;background:var(--black)}
  .page{position:absolute;left:0;top:0;width:300px;height:450px;background:#eeece6;transform-origin:0 0;
        transition:transform 1100ms cubic-bezier(.65,0,.35,1)}
  .p{position:absolute;overflow:hidden;outline:1.2px solid #111;transition:opacity 800ms ease}
  .page.guided .p{opacity:.06}
  .page.guided .p.on{opacity:1}
  .hud{position:absolute;left:32px;right:32px;bottom:22px;display:flex;align-items:baseline;font-size:10px;letter-spacing:.14em;color:var(--grey)}
  .count{position:absolute;left:50%;transform:translateX(-50%);color:var(--white);opacity:.6}
  .mode{margin-left:auto;display:flex;gap:14px}
  .mode button{all:unset;cursor:pointer;color:var(--grey);opacity:.6}
  .mode button.on{color:var(--white);opacity:1}
</style></head>
<body>
<div class="wrap">
  <div>
    <div class="cap">Library</div>
    <div class="screen">
      <div class="bar">
        <div class="mark">AION</div>
        <div class="nav"><b>Library</b><span>Arcs</span><span>Search</span></div>
      </div>
      <div class="resume">
        <div class="cover" style="background:radial-gradient(circle at 66% 30%,#eee 0 9%,transparent 9.5%),linear-gradient(180deg,#000,#1c1c1c)"></div>
        <div>
          <div class="k">Continue</div>
          <div class="title">Monolith</div>
          <div class="sub">Issue 3 · Page 14 of 22</div>
          <div class="prog"><span style="width:62%"></span></div>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <div>
    <div class="cap">Reader · Guided View (click to advance)</div>
    <div class="screen reader">
      <div class="stage" id="stage"><div class="page" id="page"></div></div>
      <div class="hud">
        <span class="count" id="count"></span>
        <div class="mode"><button id="ltr" class="on">LTR</button><button id="rtl">RTL</button></div>
      </div>
    </div>
  </div>
</div>
<script>
// placeholder covers in greyscale — real cover art supplies the colour
const covers=[
  ["Saga","linear-gradient(160deg,#e9e9e6 0 55%,#2a2a2a 55% 56.5%,#e9e9e6 56.5%)",.4],
  ["Berserk","linear-gradient(180deg,#0b0b0b,#2b2b2b)",1],
  ["Akira","linear-gradient(180deg,#8a8a8a 0 62%,#efefec 62%)",0],
  ["Black Hole","radial-gradient(circle at 50% 42%,#000 0 26%,#ecebe7 27%)",.8],
  ["Vagabond","linear-gradient(180deg,#e2e1dc,#a9a8a3)",.15],
  ["Planetary","radial-gradient(circle at 70% 30%,#eee 0 9%,transparent 10%),linear-gradient(180deg,#151515,#050505)",0],
  ["Monstress","linear-gradient(200deg,#3a3a3a,#0e0e0e)",.55],
];
document.getElementById('grid').innerHTML=covers.map(([t,bg,p])=>`
  <div class="item">
    <div class="cover" style="background:${bg}"></div>
    <div class="bar1">${p&&p<1?`<span style="width:${p*100}%"></span>`:''}</div>
    <div class="lbl">${t}</div>
  </div>`).join('');

const P=[[12,12,276,130],[12,150,134,140],[154,150,134,140],[12,298,88,140],[108,298,88,140],[204,298,84,140]];
const art=[
  "radial-gradient(140% 120% at 50% 160%,#161616 0 58%,#eeece6 58.5% 59.5%,transparent 60%),radial-gradient(circle at 50% 40%,#fff 0 4%,transparent 5%),linear-gradient(180deg,#000,#0c0c0c)",
  "linear-gradient(90deg,transparent 42%,#050505 42% 58%,transparent 58%) 0 30%/100% 50% no-repeat,linear-gradient(180deg,#ecebe6 0 76%,#c9c8c3 76%)",
  "radial-gradient(circle at 50% 50%,#eeece6 0 16%,#000 17%)",
  "repeating-linear-gradient(0deg,#111 0 2px,#eeece6 2px 9px)",
  "radial-gradient(circle at 50% 60%,#111 0 18%,transparent 19%),linear-gradient(180deg,#e4e3de,#eeece6)",
  "linear-gradient(180deg,#eeece6,#eeece6) 50% 100%/2px 62% no-repeat,radial-gradient(circle at 50% 20%,#fff 0 6%,#000 7%)",
];
const page=document.getElementById('page'), stage=document.getElementById('stage');
page.innerHTML=P.map(([x,y,w,h],i)=>`<div class="p" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${art[i]}"></div>`).join('');
const els=[...page.children];
const orders={ltr:[0,1,2,3,4,5],rtl:[0,2,1,5,4,3]};
let mode='ltr', step=0;
function fit(x,y,w,h,pad){
  const W=stage.clientWidth,H=stage.clientHeight-30;
  const s=Math.min(W*pad/w,H*pad/h);
  return `translate(${W/2-(x+w/2)*s}px,${H/2-(y+h/2)*s}px) scale(${s})`;
}
function render(){
  const c=document.getElementById('count');
  els.forEach(e=>e.classList.remove('on'));
  if(step===0){page.classList.remove('guided');page.style.transform=fit(0,0,300,450,.9);c.textContent='';return}
  const idx=orders[mode][step-1]; els[idx].classList.add('on'); page.classList.add('guided');
  const [x,y,w,h]=P[idx]; page.style.transform=fit(x,y,w,h,.84);
  c.textContent=`${step} / 6`;
}
const adv=()=>{step=(step+1)%7;render()};
let t=setInterval(adv,2600);
const restart=()=>{clearInterval(t);t=setInterval(adv,2600)};
function setMode(m,e){e.stopPropagation();mode=m;ltr.classList.toggle('on',m==='ltr');rtl.classList.toggle('on',m==='rtl');step=0;render();restart()}
ltr.onclick=e=>setMode('ltr',e); rtl.onclick=e=>setMode('rtl',e);
document.querySelector('.reader').onclick=()=>{adv();restart()};
page.style.transition="none";render();page.offsetWidth;page.style.transition="";addEventListener('resize',render);
</script>
</body></html>
